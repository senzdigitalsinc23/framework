services:
  web:
    image: nginx:1.27-alpine
    depends_on:
      - php-app
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www:cached
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      - NGINX_ENVSUBST_OUTPUT_DIR=/etc/nginx/conf.d

  php:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev   # change to "base" for prod image without Xdebug
    environment:
      APP_NAME: 'Basic Schools Record Management System'
      SCHOOL: "Learners Bridge Academy"
      APP_URL: "http://localhost:8000"
      APP_ENV: production
      APP_DEBUG: true
      RATE_LIMIT_MAX: 60
      RATE_LIMIT_WINDOW: 60
      CORS_ALLOWED_ORIGINS: "http://localhost:8000"
      API_KEY: devKey123
      API_SECRET: tem22ple12345?
      DB_HOST: 127.0.0.1
      DB_NAME: basturms_db
      DB_USER: root
      DB_PASS: tem22ple12345?
      DB_DRIVER: mysql
      MAIL_HOST: smtp.gmail.com
      MAIL_USER: senzdigitals.inc23@gmail.com
      MAIL_PASS: "ncfg wwxy cbol cgzw"
      MAIL_FROM: senzdigitals.inc23@gmail.com
      MAIL_NAME: "Senz Digitals Inc"
      MAIL_PORT: 465
      MAIL_ENCRYPTION: ssl
      SMS_ID: ACf064e5046bd1be23e7b61d2331cadb72
      TOKEN: 2ee9886ba3b09f145a6526e5806ffbc7
      SMS_FROM: +233240561313

      JWT_SECRET: your_super_secret_key

      MOMO_BASE_URL: https://sandbox.momodeveloper.mtn.com/collection/v1_0
      MOMO_PRIMARY_KEY: your_api_key
      MOMO_USER_ID: your_generated_user_id
      MOMO_CALLBACK_URL: http://127.0.0.1/webhook/momo
      MOMO_CURRENCY: GHS

      HUBTEL_BASE_URL: 'https://payproxyapi.hubtel.com'
      HUBTEL_CLIENT_ID: your_hubtel_client_id
      HUBTEL_CLIENT_SECRET: your_hubtel_secret
      HUBTEL_CALLBACK_URL: https://yourdomain.com/webhook/hubtel

      PAYSTACK_BASE_URL: https://api.paystack.co
      PAYSTACK_SECRET_KEY: your_paystack_key
      PAYSTACK_CALLBACK_URL: https://yourdomain.com/webhook/paystack
      API_RATE_MAX: 120
      API_RATE_WINDOW: 60
      TZ: UTC
    volumes:
      - ./:/var/www:cached
      - ./docker/php:/var/www/docker/php
    healthcheck:
      test: ["CMD", "php", "-v"]
      interval: 10s
      timeout: 3s
      retries: 5

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: basturms_db
      MYSQL_USER: basturms
      MYSQL_PASSWORD: tem22ple12345?
      MYSQL_ROOT_PASSWORD: tem22ple12345?
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql
    command: ["--default-authentication-plugin=mysql_native_password"]
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  cache:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  dbdata:
  redisdata:
