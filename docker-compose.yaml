services:
  web:
    image: nginx:1.27-alpine
    depends_on:
      - php-app
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www:cached
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      - NGINX_ENVSUBST_OUTPUT_DIR=/etc/nginx/conf.d
  php-app:
    build:
      context: .
      target: dev
    container_name: php-framework
    restart: unless-stopped
    init: true
    environment:
      APP_NAME: 'Basic Schools Record Management System'
      SCHOOL: "Learners Bridge Academy"
      APP_URL: "http://localhost:8000"
      APP_ENV: production
      APP_DEBUG: true
      
    volumes:
      - ./:/var/www:cached
      - ./docker/php:/var/www/docker/php
    healthcheck:
      test: ["CMD", "php", "-v"]
      interval: 10s
      timeout: 3s
      retries: 5
      
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: basturms_db
      MYSQL_USER: basturms
      MYSQL_PASSWORD: tem22ple12345?
      MYSQL_ROOT_PASSWORD: tem22ple12345?
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql
    command: ["--default-authentication-plugin=mysql_native_password"]
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  cache:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

    # env_file: ./.env  # Uncomment if .env file exists
    networks:
      - appnet
    expose:
      - "8000"  # PHP-FPM default port
    # The application expects to be run behind a web server (nginx/apache) proxying to PHP-FPM
    # You can add a web server service if needed, or use this with your own reverse proxy

volumes:
  dbdata:
  redisdata:

networks:
  appnet:
    driver: bridge
